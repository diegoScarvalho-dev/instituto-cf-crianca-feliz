<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Cadastro - Instituto CF
    </title>

    <link
        rel="stylesheet"
        href="style.css">
</head>


<body>

    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header>

        <h1>Cadastro</h1>

        <nav id="menu-principal">

            <a
                href="#inicio"
                data-rota="inicio">
                Início
            </a>

            <a
                href="#projetos"
                data-rota="projetos">
                Projetos
            </a>

            <a
                href="#cadastro"
                data-rota="cadastro">
                Cadastro
            </a>

        </nav>

    </header>


    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main>

        <section>

            <h2>
                Faça seu cadastro
            </h2>


            <!-- =================================
                 FORMULÁRIO
            ================================== -->

            <form
                id="form-cadastro"
                novalidate>


                <!-- =============================
                     DADOS PESSOAIS
                ============================== -->

                <fieldset>

                    <legend>
                        Dados pessoais
                    </legend>


                    <div class="campo">

                        <label for="nome">
                            Nome completo:
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required>

                    </div>


                    <div class="campo">

                        <label for="email">
                            E-mail:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemplo@email.com"
                            required>

                    </div>


                    <div class="campo">

                        <label for="nascimento">
                            Data de nascimento:
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento"
                            required>

                    </div>


                    <div class="campo">

                        <label for="cpf">
                            CPF:
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            title="Digite somente os números do CPF"
                            autocomplete="off"
                            required>

                    </div>


                    <div class="campo">

                        <label for="telefone">
                            Telefone:
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            maxlength="15"
                            inputmode="numeric"
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            title="Digite somente os números do telefone"
                            autocomplete="tel"
                            required>

                    </div>

                </fieldset>


                <!-- =============================
                     ENDEREÇO
                ============================== -->

                <fieldset>

                    <legend>
                        Endereço
                    </legend>


                    <!-- CEP PRIMEIRO -->

                    <div class="campo">

                        <label for="cep">
                            CEP:
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            maxlength="9"
                            inputmode="numeric"
                            pattern="[0-9]{5}-[0-9]{3}"
                            title="Digite somente os números do CEP"
                            autocomplete="postal-code"
                            required>

                    </div>


                    <!-- ENDEREÇO PREENCHIDO PELO CEP -->

                    <div class="campo">

                        <label for="endereco">
                            Endereço:
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            placeholder="Rua / Avenida"
                            autocomplete="street-address"
                            required>

                    </div>


                    <!-- NÚMERO -->

                    <div class="campo">

                        <label for="numero">
                            Nº:
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="Número"
                            inputmode="numeric"
                            required>

                    </div>


                    <!-- BAIRRO -->

                    <div class="campo">

                        <label for="bairro">
                            Bairro:
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            placeholder="Bairro">

                    </div>


                    <!-- COMPLEMENTO -->

                    <div class="campo">

                        <label for="complemento">
                            Complemento:
                        </label>

                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Apartamento, bloco etc.">

                    </div>


                    <!-- CIDADE -->

                    <div class="campo">

                        <label for="cidade">
                            Cidade:
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2"
                            required>

                    </div>


                    <!-- ESTADO -->

                    <div class="campo">

                        <label for="estado">
                            Estado:
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            autocomplete="address-level1"
                            required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>

                        </select>

                    </div>

                </fieldset>


                <!-- =============================
                     BOTÃO
                ============================== -->

                <div class="acoes">

                    <button type="submit">
                        Cadastrar
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================================
         RODAPÉ
    ========================================== -->

    <footer>

        <p>
            &copy; 2026 Instituto CF - Criança Feliz
        </p>

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

   <script
    type="module"
    src="js/script.js">
</script>

</body>

</html>
